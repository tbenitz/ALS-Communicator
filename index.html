async function speakWithElevenLabs(text){if(!elevenApiKey||!selectedElevenVoiceId){speakWithOS(text);return;}try{genBtn.disabled=true;btnText.innerHTML='<span>🔊...</span>';const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${selectedElevenVoiceId}/stream`,{method:'POST',headers:{'Accept':'audio/mpeg','xi-api-key':elevenApiKey,'Content-Type':'application/json'},body:JSON.stringify({text,model_id:"eleven_monolingual_v1",voice_settings:elevenSettings})});if(!r.ok)throw new Error();const b=await r.blob(),u=URL.createObjectURL(b),a=new Audio(u);a.onended=()=>{URL.revokeObjectURL(u);finishTTS();};a.onerror=()=>{URL.revokeObjectURL(u);finishTTS();};if(settings.audioBoost>1){if(!audioContextGlobal)audioContextGlobal=new(window.AudioContext||window.webkitAudioContext)();if(audioContextGlobal.state==='suspended')await audioContextGlobal.resume();const s=audioContextGlobal.createMediaElementSource(a),g=audioContextGlobal.createGain();g.gain.value=settings.audioBoost;s.connect(g).connect(audioContextGlobal.destination);}a.play();lastSpoken=text;}catch(e){speakWithOS(text);}}
function speakWithOS(text){if(!text||!window.speechSynthesis){finishTTS();return;}lastSpoken=text;window.speechSynthesis.cancel();genBtn.disabled=true;btnText.innerHTML='<span>🔊...</span>';setTimeout(()=>{const u=new SpeechSynthesisUtterance(text);if(availableVoices.length===0)availableVoices=speechSynthesis.getVoices();const sv=localStorage.getItem('selectedVoiceURI');if(sv&&availableVoices.length){const ev=availableVoices.find(v=>v.voiceURI===sv);if(ev)u.voice=ev;}else{u.lang='en-US';}u.volume=Math.min(1,settings.audioBoost);u.rate=0.92;u.onend=finishTTS;u.onerror=()=>finishTTS();window.speechSynthesis.speak(u);},100);}
async function fetchElevenVoices(){if(!elevenApiKey)return;try{const r=await fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':elevenApiKey}});if(r.ok){elevenVoices=(await r.json()).voices||[];renderElevenVoiceSelect();}}catch(e){}}

function handlePhraseTap(phrase){
    if(isEditMode||isReorderMode)return;
    resetInactivityTimer();
    if(settings.clickAction==='speak'){
        speak(phrase);
        textInput.value='';
    } else {
        // If elaborate mode is on, replace the input entirely since the suggestion already incorporates the intent
        if(settings.elaborateResponses){
            textInput.value = phrase + ' ';
        } else {
            textInput.value += (textInput.value && !textInput.value.endsWith(' ') ? ' ' : '') + phrase + ' ';
        }
        textInput.scrollTop = textInput.scrollHeight;
        textInput.focus();
    }
}
function saveToStorage(){localStorage.setItem('alsPhrases',JSON.stringify(phraseCategories));}

function renderPhrases(){
    phraseGridEl.innerHTML='';
    addPhraseBtn.classList.toggle('hidden',!isEditMode);
    editCategoryBtn.classList.toggle('hidden',!isEditMode);
    reorderBtn.classList.toggle('hidden',!isEditMode);
    
    if(isEditMode){
        reorderBtn.className=isReorderMode?'bg-green-600 hover:bg-green-500 text-white px-3 py-1 md:py-1.5 rounded-lg font-bold border border-green-500 transition-all text-xs md:text-sm shadow-sm':'bg-yellow-600 hover:bg-yellow-500 text-white px-3 py-1 md:py-1.5 rounded-lg font-bold border border-yellow-500 transition-all text-xs md:text-sm shadow-sm';
        reorderBtn.innerHTML=isReorderMode?'✅ Done Reordering':'↕️ Reorder';
    }
    
    editToggleBtn.className=isEditMode?'bg-blue-600 text-white px-4 py-1.5 rounded-lg font-bold border border-blue-500 shadow-sm':'bg-slate-700 text-slate-300 px-4 py-1.5 rounded-lg font-bold border border-slate-500 shadow-sm';
    editToggleBtn.innerHTML=isEditMode?'Done':'✏️ Edit';
    
    if(phraseCategories[currentCategory]){
        phraseCategories[currentCategory].forEach((phrase,idx)=>{
            const btn=document.createElement('button');
            btn.textContent=phrase;
            btn.className=`p-2 md:p-4 text-[13px] sm:text-base md:text-xl font-bold rounded-xl shadow-md min-h-[56px] md:min-h-[80px] flex items-center justify-center text-center ${isEditMode?'bg-slate-800 text-blue-300 edit-mode-btn cursor-pointer':'bg-slate-700 hover:bg-slate-600 text-white border border-slate-600'} ${isReorderMode?'phrase-btn':''}`;
            btn.draggable=isReorderMode;
            btn.dataset.idx=idx;
            
            btn.onclick=()=>{
                if(isReorderMode)return;
                if(isEditMode)openModal(phrase,currentCategory,idx);
                else handlePhraseTap(phrase);
            };
            
            btn.addEventListener('dragstart',(e)=>{
                if(!isReorderMode)return;
                draggedPhraseIdx=idx;
                btn.classList.add('dragging');
                e.dataTransfer.effectAllowed='move';
            });
            btn.addEventListener('dragend',()=>{btn.classList.remove('dragging');draggedPhraseIdx=null;});
            btn.addEventListener('dragover',(e)=>{if(!isReorderMode)return;e.preventDefault();btn.classList.add('drag-over');});
            btn.addEventListener('dragleave',()=>{btn.classList.remove('drag-over');});
            btn.addEventListener('drop',(e)=>{
                e.preventDefault();
                btn.classList.remove('drag-over');
                if(!isReorderMode||draggedPhraseIdx===null||draggedPhraseIdx===idx)return;
                const phrases=phraseCategories[currentCategory];
                const moved=phrases.splice(draggedPhraseIdx,1)[0];
                phrases.splice(idx,0,moved);
                saveToStorage();renderPhrases();
            });
            
            phraseGridEl.appendChild(btn);
        });
    }
}

function renderConversationHistory(){
    convHistoryEl.innerHTML='';convHistoryMobileEl.innerHTML='';
    const seen=new Set();
    const unique=conversationHistory.filter(m=>{const k=`${m.speaker}|${m.text}`;if(seen.has(k))return false;seen.add(k);return true;});
    if(unique.length!==conversationHistory.length){conversationHistory=unique;saveConversation();}
    conversationHistory.forEach(m=>{appendMessageUI(m.speaker,m.text,convHistoryEl);appendMessageUI(m.speaker,m.text,convHistoryMobileEl);});

function appendMessageUI(speaker,text,container){
    const div=document.createElement('div');
    div.className=`msg ${speaker==='you'?'msg-you':'msg-other'}`;
    let displayText=text,speakerLabel='';
    if(text.startsWith('(Speaker ')||text.startsWith('(You)')||text.startsWith('(Partner)')){
        const m=text.match(/^\(([^)]+)\)\s*(.*)/);
        if(m){speakerLabel=m[1];displayText=m[2];}
    }
    let h=`<div>${speakerLabel&&speaker!=='you'?`<span class="text-xs text-indigo-400 font-bold">${speakerLabel}: </span>`:''}${displayText}</div>`;
    if(speaker==='you')h+=`<button class="save-phrase-btn" onclick="window.openSaveFromHistory('${displayText.replace(/'/g,"\\'")}')">💾 Save</button>`;
    div.innerHTML=h;container.appendChild(div);
}

function addToConversation(speaker,text){
    const last=conversationHistory[conversationHistory.length-1];
    if(last&&last.speaker===speaker&&last.text===text)return;
    conversationHistory.push({speaker,text});saveConversation();renderConversationHistory();
}

// ====================== AI SUGGESTIONS - GROK ONLY, CONTEXTUAL ======================
async function generateGrokSuggestions(retryCount=0){
    if(aiRequestInProgress&&retryCount===0)return;
    if(retryCount===0)aiRequestInProgress=true;
    
    let n=settings.aiCount,cl=settings.aiContext;
    const ll=["very short (1-5 words)","medium (one casual phrase)","longer (a full sentence)"];
    const tl=ll[settings.replyLen-1];
    
    if(retryCount===0){
        grokSuggestionsEl.innerHTML=`<div class="col-span-full text-center text-slate-400 py-6 font-bold">Generating suggestions...</div>`;
        suggestStatus.textContent='AI Thinking...';
    }
    
    const recentConv=conversationHistory.slice(-cl);
    let convStr='';
    recentConv.forEach(m=>{
        const role=m.speaker==='you'?'ALS User':'Partner';
        convStr+=`${role}: ${m.text}\n`;
    });
    
    let promptExtra='';
    if(settings.useUnsentContext&&textInput.value.trim()){
        const inputText=textInput.value.trim();
        if(settings.elaborateResponses){
            // When elaborate mode is on, generate full responses that replace the input
            promptExtra=`\n\nIMPORTANT - The ALS user has typed "${inputText}" but this may be incomplete or just keywords. Generate COMPLETE, fully-formed responses that ELABORATE these keywords into a natural, polite, and complete thought. For example, if the user typed "water" generate something like "Could I have some water, please?" If they typed "pain" generate something like "I'm feeling some pain right now." If they typed "yes water" generate "Yes, I'd like some water please." The suggestions should REPLACE the user's input entirely, not just continue after it. Make them sound natural and conversational. Do NOT include the original keywords as-is followed by more text - instead create one cohesive complete sentence that incorporates the intent.`;
        } else {
            promptExtra=`\n\nIMPORTANT - The ALS user is currently typing: "${inputText}". They want suggestions that CONTINUE or ELABORATE on this thought, NOT answer it as a question. Generate phrases that extend this topic naturally in a conversational way.`;
        }
    }
    
    const prompt=`You are helping a person with ALS communicate. Here is the recent conversation between the ALS User and their Partner:

${convStr}${promptExtra}

Generate exactly ${n} natural, casual conversational phrases that the ALS User might say next. These should be ${tl}. The phrases should flow naturally from the conversation context. If the user is typing something, generate phrases that continue or elaborate on their current thought. Return exactly ${n} phrases, one per line, with no quotes.`;

    try{
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),15000);
        
        const r=await fetch(G,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({model:'grok-3-mini',messages:[{role:'user',content:prompt}],max_tokens:250,temperature:0.7}),
            signal:controller.signal
        });
        clearTimeout(timeout);
        
        if(!r.ok){
            if(retryCount<3&&(r.status===429||r.status>=500)){
                await new Promise(res=>setTimeout(res,1000*(retryCount+1)));
                return generateGrokSuggestions(retryCount+1);
            }
            throw new Error(`HTTP ${r.status}`);
        }
        
        const d=await r.json();
        const sugs=d.choices[0].message.content.trim().split('\n').map(s=>s.trim().replace(/^[\d\.\-\*\"\s]+/,'').replace(/\"/g,'')).filter(s=>s.length>1);
        
        grokSuggestionsEl.innerHTML='';
        suggestStatus.textContent='AI Suggestions';
        sugs.slice(0,n).forEach(p=>{
            const btn=document.createElement('button');
            btn.className='suggestion-btn';
            btn.textContent=p;
            btn.onclick=()=>{
                if(isEditMode||isReorderMode)return;
                resetInactivityTimer();
                if(settings.clickAction==='speak'){
                    speak(p);
                    textInput.value='';
                } else {
                    // When elaborate is on, replace the input entirely with the elaborated response
                    if(settings.elaborateResponses){
                        textInput.value = p + ' ';
                    } else {
                        textInput.value += (textInput.value && !textInput.value.endsWith(' ') ? ' ' : '') + p + ' ';
                    }
                    textInput.scrollTop = textInput.scrollHeight;
                    textInput.focus();
                }
            };
            grokSuggestionsEl.appendChild(btn);
        });
    }catch(e){
        if(retryCount<2){
            suggestStatus.textContent=`Retrying (${retryCount+1}/3)...`;
            await new Promise(res=>setTimeout(res,800));
            return generateGrokSuggestions(retryCount+1);
        }
        suggestStatus.textContent='Failed - click to retry';
        grokSuggestionsEl.innerHTML='<div class="col-span-full text-center text-red-400 py-6">Failed. Click again.</div>';
    }finally{
        if(retryCount===0||retryCount>=2)aiRequestInProgress=false;
    }
}

// ====================== ASSEMBLYAI ======================
async function getAssemblyToken(){try{const r=await fetch(T);if(!r.ok)return null;const d=await r.json();return d.token;}catch(e){return null;}}
async function startAssemblyAI(){
    if(isAssemblyListening)return;
    try{
        const token=await getAssemblyToken();
        if(!token){alert("Could not connect to speech service.");updateMicUI(false);return;}
        const diarize=useAssemblyAIChk.checked;
        const params=new URLSearchParams({token,speech_model:'universal-streaming-english',sample_rate:'16000',encoding:'pcm_s16le'});
        if(diarize){params.append('speaker_labels','true');params.append('max_speakers','6');}
        assemblyWS=new WebSocket(`wss://streaming.assemblyai.com/v3/ws?${params.toString()}`);
        assemblyWS.onopen=()=>{isAssemblyListening=true;updateMicUI(true);resetInactivityTimer();};
        assemblyWS.onmessage=(event)=>{
            try{
                const data=JSON.parse(event.data);
                if(data.type==="Turn"){
                    const text=data.transcript||"";if(!text.trim())return;
                    const speakerLabel=data.speaker_label?`Speaker ${data.speaker_label}`:"Partner";
                    if(data.end_of_turn){
                        addToConversation('other',diarize?`(${speakerLabel}) ${text.trim()}`:text.trim());
                        liveTranscript.textContent=`🗣️ ${text.trim()}`;
                        setTimeout(()=>liveTranscript.classList.add('hidden'),1500);
                    }else{liveTranscript.textContent=`🗣️ ${speakerLabel}: ${text.trim()}`;liveTranscript.classList.remove('hidden');}
                }
            }catch(e){}
        };
        assemblyWS.onerror=()=>stopAssemblyAI();
        assemblyWS.onclose=()=>{if(isAssemblyListening)stopAssemblyAI();};
        assemblyStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,sampleRate:16000,echoCancellation:true,noiseSuppression:true}});
        assemblyAudioContext=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
        const source=assemblyAudioContext.createMediaStreamSource(assemblyStream);
        assemblyProcessor=assemblyAudioContext.createScriptProcessor(4096,1,1);
        assemblyProcessor.onaudioprocess=(e)=>{
            if(!assemblyWS||assemblyWS.readyState!==WebSocket.OPEN)return;
            const input=e.inputBuffer.getChannelData(0),pcm=new Int16Array(input.length);
            for(let i=0;i<input.length;i++){const s=Math.max(-1,Math.min(1,input[i]));pcm[i]=s<0?s*0x8000:s*0x7FFF;}
            assemblyWS.send(pcm.buffer);
        };
        source.connect(assemblyProcessor);assemblyProcessor.connect(assemblyAudioContext.destination);
    }catch(err){stopAssemblyAI();alert("Mic error: "+(err.message||"Permission denied"));}
}
function stopAssemblyAI(){
    if(assemblyProcessor){assemblyProcessor.disconnect();assemblyProcessor=null;}
    if(assemblyAudioContext){assemblyAudioContext.close().catch(()=>{});assemblyAudioContext=null;}
    if(assemblyStream){assemblyStream.getTracks().forEach(t=>t.stop());assemblyStream=null;}
    if(assemblyWS){if(assemblyWS.readyState===WebSocket.OPEN)try{assemblyWS.send(JSON.stringify({type:"Terminate"}));}catch(e){}assemblyWS.close();assemblyWS=null;}
    isAssemblyListening=false;updateMicUI(false);
}

function updateMicUI(l){if(l){listenBtn.classList.replace('bg-indigo-600','bg-red-600');listenBtn.classList.add('animate-pulse');listenBtn.innerHTML='<span class="text-lg md:text-xl mb-0.5">🔴</span>Mic ON';}else{listenBtn.classList.replace('bg-red-600','bg-indigo-600');listenBtn.classList.remove('animate-pulse');listenBtn.innerHTML='<span class="text-lg md:text-xl mb-0.5">🎤</span>Mic OFF';}}
let recognition=null;
listenBtn.onclick=()=>{if(settings.useAssemblyAI){if(isAssemblyListening)stopAssemblyAI();else startAssemblyAI();}else{if(!intentionallyStopped){intentionallyStopped=true;if(recognition)try{recognition.stop();}catch(e){}updateMicUI(false);}else{intentionallyStopped=false;updateMicUI(true);if(!recognition)recognition=createRecognition();if(recognition)try{recognition.start();}catch(e){}resetInactivityTimer();}}};
function createRecognition(){if(!('SpeechRecognition'in window)&&!('webkitSpeechRecognition'in window))return null;const rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();rec.lang='en-US';rec.interimResults=true;rec.continuous=true;rec.onresult=(e)=>{if(isTTSPlaying)return;let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;if(t.trim()){resetInactivityTimer();liveTranscript.textContent='🗣️ '+t;liveTranscript.classList.remove('hidden');if(e.results[e.results.length-1].isFinal){addToConversation('other',t.trim());setTimeout(()=>liveTranscript.classList.add('hidden'),1200);}}};rec.onerror=()=>{intentionallyStopped=true;updateMicUI(false);};rec.onend=()=>{if(!intentionallyStopped)try{rec.start();}catch(e){intentionallyStopped=true;updateMicUI(false);}};return rec;}

aiContextSlider.oninput=()=>{settings.aiContext=+aiContextSlider.value;aiContextVal.textContent=settings.aiContext;saveAll();};
$('exportBtn').onclick=()=>{const b=new Blob([JSON.stringify({phrases:phraseCategories,history:conversationHistory})],{type:"application/json"});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`ALS_${new Date().toISOString().split('T')[0]}.json`;a.click();};
$('importBtn').onclick=()=>$('importFileInput').click();
$('importFileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.phrases)phraseCategories=d.phrases;if(d.history)conversationHistory=d.history;saveToStorage();saveConversation();currentCategory=Object.keys(phraseCategories)[0];renderCategories();renderPhrases();renderConversationHistory();settingsModal.classList.add('hidden');}catch(er){}};r.readAsText(f);};
$('clearHistoryBtn').onclick=()=>{if(confirm("Clear all?")){conversationHistory=[];saveConversation();renderConversationHistory();settingsModal.classList.add('hidden');}};
btnActionSpeak.onclick=()=>{settings.clickAction='speak';saveAll();btnActionSpeak.className='flex-1 bg-blue-600 border-2 border-blue-400 text-white font-bold rounded-xl';btnActionType.className='flex-1 bg-slate-800 border-2 border-slate-600 text-slate-400 font-bold rounded-xl';};
btnActionType.onclick=()=>{settings.clickAction='type';saveAll();btnActionType.className='flex-1 bg-blue-600 border-2 border-blue-400 text-white font-bold rounded-xl';btnActionSpeak.className='flex-1 bg-slate-800 border-2 border-slate-600 text-slate-400 font-bold rounded-xl';};
ttsProviderSelect.onchange=()=>{settings.ttsProvider=ttsProviderSelect.value;saveAll();osVoiceSection.classList.toggle('hidden',settings.ttsProvider!=='os');elevenlabsSection.classList.toggle('hidden',settings.ttsProvider!=='elevenlabs');};
function populateVoiceList(){if(typeof speechSynthesis==='undefined')return;availableVoices=speechSynthesis.getVoices();voiceSelect.innerHTML='';let en=availableVoices.filter(v=>v.lang.startsWith('en'));if(!en.length)en=availableVoices;const sv=localStorage.getItem('selectedVoiceURI');en.forEach(v=>{const o=document.createElement('option');o.textContent=`${v.name}(${v.lang})`;o.value=v.voiceURI;if(v.voiceURI===sv)o.selected=true;voiceSelect.appendChild(o);});}
if('speechSynthesis'in window){populateVoiceList();speechSynthesis.onvoiceschanged=populateVoiceList;}
voiceSelect.onchange=()=>localStorage.setItem('selectedVoiceURI',voiceSelect.value);
stabSlider.oninput=()=>{elevenSettings.stability=+stabSlider.value;stabVal.textContent=elevenSettings.stability.toFixed(2);saveAll();};
simSlider.oninput=()=>{elevenSettings.similarity_boost=+simSlider.value;simVal.textContent=elevenSettings.similarity_boost.toFixed(2);saveAll();};
styleSlider.oninput=()=>{elevenSettings.style=+styleSlider.value;styleVal.textContent=elevenSettings.style.toFixed(2);saveAll();};
boostSlider.oninput=()=>{elevenSettings.speaker_boost=+boostSlider.value>0.5;boostVal.textContent=elevenSettings.speaker_boost?'On':'Off';saveAll();};
saveApiKeyBtn.onclick=async()=>{const k=elevenApiKeyInput.value.trim();if(k){elevenApiKey=k;saveAll();await fetchElevenVoices();}};
refreshElevenVoicesBtn.onclick=fetchElevenVoices;
elevenVoiceSelect.onchange=()=>{selectedElevenVoiceId=elevenVoiceSelect.value;saveAll();};
useAssemblyAIChk.onchange=()=>{settings.useAssemblyAI=useAssemblyAIChk.checked;saveAll();if(isAssemblyListening&&!settings.useAssemblyAI)stopAssemblyAI();};
useUnsentContext.onchange=()=>{settings.useUnsentContext=useUnsentContext.checked;saveAll();};
elaborateResponses.onchange=()=>{settings.elaborateResponses=elaborateResponses.checked;saveAll();};
window.openSaveFromHistory=text=>{isEditMode=true;openModal(text,currentCategory,-1);$('modalTitle').textContent="Save";$('modalDeleteBtn').classList.add('hidden');};

// Init
(function init(){
    aiCountSlider.value=settings.aiCount;aiCountVal.textContent=settings.aiCount;
    replyLenSlider.value=settings.replyLen;replyLenVal.textContent=["Short","Medium","Long"][settings.replyLen-1];
    aiContextSlider.value=settings.aiContext;aiContextVal.textContent=settings.aiContext;
    audioBoostSlider.value=settings.audioBoost;audioBoostVal.textContent=settings.audioBoost.toFixed(1)+'x';
    ttsProviderSelect.value=settings.ttsProvider;osVoiceSection.classList.toggle('hidden',settings.ttsProvider!=='os');
    elevenlabsSection.classList.toggle('hidden',settings.ttsProvider!=='elevenlabs');
    useAssemblyAIChk.checked=settings.useAssemblyAI;useUnsentContext.checked=settings.useUnsentContext;
    elaborateResponses.checked=settings.elaborateResponses||false;
    elevenApiKeyInput.value=elevenApiKey;
    stabSlider.value=elevenSettings.stability;stabVal.textContent=elevenSettings.stability.toFixed(2);
    simSlider.value=elevenSettings.similarity_boost;simVal.textContent=elevenSettings.similarity_boost.toFixed(2);
    styleSlider.value=elevenSettings.style;styleVal.textContent=elevenSettings.style.toFixed(2);
    boostSlider.value=elevenSettings.speaker_boost?1:0;boostVal.textContent=elevenSettings.speaker_boost?'On':'Off';
    if(settings.clickAction==='speak'){btnActionSpeak.className='flex-1 bg-blue-600 border-2 border-blue-400 text-white font-bold rounded-xl';btnActionType.className='flex-1 bg-slate-800 border-2 border-slate-600 text-slate-400 font-bold rounded-xl';}
    else{btnActionType.className='flex-1 bg-blue-600 border-2 border-blue-400 text-white font-bold rounded-xl';btnActionSpeak.className='flex-1 bg-slate-800 border-2 border-slate-600 text-slate-400 font-bold rounded-xl';}
    desktopConvContainer.style.maxHeight=settings.convHeight;
    renderCategories();renderPhrases();renderConversationHistory();populateVoiceList();
    if(elevenApiKey)fetchElevenVoices();
})();
grokSuggestBtn.onclick=()=>generateGrokSuggestions(0);
console.log("✅ Ready");
</script>
</body>
</html>
